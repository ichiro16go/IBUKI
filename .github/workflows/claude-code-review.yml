name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # デバッグ中はフルログを出して、コメント未投稿時の原因を追いやすくする
          show_full_output: true
          # サマリーコメントを1つに保つ（更新時に追記ではなく集約）
          use_sticky_comment: true
          # インラインコメントは分類して投稿（ノイズ低減）
          classify_inline_comments: true
          prompt: |
            このPRを日本語でコードレビューしてください。
            必ず以下2種類を残してください:
            1) PR全体へのサマリーコメント（結論・懸念点・LGTM可否）
            2) 必要箇所へのインラインコメント（行単位で具体的に）

            レビュー観点:
            - コードの品質・可読性
            - バグや潜在的な問題
            - セキュリティ上の懸念
            - パフォーマンスの問題
            - 改善提案

            重大な問題がなければサマリー末尾に「LGTM」を含めてください。
